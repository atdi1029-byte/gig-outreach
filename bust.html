<!DOCTYPE html><html><head><title>Cache Bust</title></head><body>
<p>Clearing cache...</p>
<script>
(async()=>{
  if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    for(const r of regs) await r.unregister();
  }
  const keys=await caches.keys();
  for(const k of keys) await caches.delete(k);
  document.body.innerHTML='<p>Cache cleared! Redirecting...</p>';
  // Cache-buster so GitHub Pages' HTTP cache can't hand back the old page
  setTimeout(()=>location.href='./index.html?_='+Date.now(),1500);
})();
</script>
</body></html>
