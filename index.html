const REVIEWED_KEY = 'outreach_reviewed_reports';
const REVIEWED_BASE_KEY = 'outreach_reviewed_reports_base'; // cloud map as of the last successful sync
let _reviewedReportsCache = null;
let _reviewedPullFailed = false; // fresh device whose first pull failed: gate stays locked, banner says why
function getReviewedReports() {
    if (_reviewedReportsCache) return _reviewedReportsCache;
    const m = lsJSON(REVIEWED_KEY, {});
    return (m && typeof m === 'object' && !Array.isArray(m)) ? m : {};
}
function setReportReviewed(file, reviewed) {
    const data = Object.assign({}, getReviewedReports());
    if (reviewed) data[file] = Date.now();
    else delete data[file];
    writeJSON(REVIEWED_KEY, data);
    _reviewedReportsCache = data;
    syncReviewedReports();
}
// Pull, 3-way merge against the last synced copy, push only when the merge differs from the
// cloud. An un-review on one device now sticks, and a failed pull never overwrites the cloud.
let _reviewedSyncBusy = false;
let _reviewedSyncWaiters = [];
let _reviewedSyncAgain = false;
function syncReviewedReports(done) {
    if (!BASE_URL) { if (done) done(false); return; }
    if (done) _reviewedSyncWaiters.push(done);
    if (_reviewedSyncBusy) { _reviewedSyncAgain = true; return; }
    _reviewedSyncBusy = true;
    const finish = ok => {
        _reviewedSyncBusy = false;
        const waiters = _reviewedSyncWaiters;
        _reviewedSyncWaiters = [];
        waiters.forEach(fn => fn(ok));
        if (_reviewedSyncAgain) { _reviewedSyncAgain = false; syncReviewedReports(); }
    };
    jsonpFetch(buildUrl({ action: 'get_reviewed_reports' }), function(err, json) {
      // finish() must always run — the dashboard render waits on it
      try {
        const cloud = json && json.reviewed;
        if (err || !json || json.status !== 'ok' || !cloud || typeof cloud !== 'object' || Array.isArray(cloud)) {
            finish(false);
            return;
        }
        _reviewedPullFailed = false;
        const merged = merge3(getReviewedReports(), cloud, lsJSON(REVIEWED_BASE_KEY, {}));
        writeJSON(REVIEWED_KEY, merged);
        _reviewedReportsCache = merged;
        _gatedVenueIds = null;
        if (mapsEqual(merged, cloud)) { writeJSON(REVIEWED_BASE_KEY, cloud); finish(true); return; }
        fireGet(buildUrl({ action: 'save_reviewed_reports', data: JSON.stringify(merged) }), function(res) {
            if (res.status === 'ok') writeJSON(REVIEWED_BASE_KEY, merged);
            else showToast('Reviewed reports not synced: ' + resMsg(res));
            finish(true);
        });
      } catch (e) { console.error('Reviewed reports sync error:', e); finish(false); }
    }, 15000);
}
function loadReviewedReportsFromCloud() {
    return new Promise(function(resolve) {
        syncReviewedReports(function(ok) {
            if (!ok && Object.keys(getReviewedReports()).length === 0) _reviewedPullFailed = true;
            resolve();
        });
    });
}
function retryReviewedPull() {
    syncReviewedReports(function(ok) { if (ok && dashboardData) renderStateGrid(); });
}

async function openReportsView() {
    const body = document.getElementById('reportsBody');
    const baseUrl = 'https://atdi1029-byte.github.io/gig-outreach/reports/';

    body.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-dim)">Loading reports...</div>';
    if (navStack[navStack.length - 1] !== 'viewReports') navigateTo('viewReports');

    const reports = await loadReportManifest(true);
    const reviewed = getReviewedReports();

    // Dedupe by file name (keep first occurrence)
    const seen = new Set();
    const unique = (reports || []).filter(r => {
        if (!r || seen.has(r.file)) return false;
        seen.add(r.file);
        return true;
    });

    let html = '';
    html += `<div style="font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold);margin-bottom:0.5rem">Run Reports</div>`;
    const gatedCount = getGatedVenueIds().size;
    if (gatedCount > 0) {
        html += `<div style="font-size:0.75rem;color:var(--red);margin-bottom:0.6rem">${gatedCount} venues hidden until reports confirmed</div>`;
    }
    if (unique.length === 0) {
        html += '<div style="text-align:center;padding:1rem;color:var(--text-dim);font-size:0.85rem">No reports yet.</div>';
    } else {
        const unread = unique.filter(r => !reviewed[r.file] || isActiveRun(r)).length;
        if (unread > 0) {
            html += `<div style="font-size:0.8rem;color:var(--text-dim);margin-bottom:0.8rem">${unread} unreviewed</div>`;
        }

        // Group by month (YYYY-MM)
        const months = {};
        for (const r of unique) {
            const key = r.date ? String(r.date).slice(0, 7) : 'other';
            if (!months[key]) months[key] = [];
            months[key].push(r);
        }

        const monthNames = {
            '01':'January','02':'February','03':'March',
            '04':'April','05':'May','06':'June',
            '07':'July','08':'August','09':'September',
            '10':'October','11':'November','12':'December'
        };

        for (const key of Object.keys(months).sort().reverse()) {
            const [yr, mo] = key.split('-');
            const label = mo ? `${monthNames[mo] || mo} ${yr}` : 'Other';
            html += `<div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin:1rem 0 0.4rem;padding-bottom:0.3rem;border-bottom:1px solid var(--border)">${esc(label)}</div>`;
            for (const r of months[key]) {
                const fileUrl = `${baseUrl}${encodeURI(String(r.file || ''))}`;
                const running = isActiveRun(r);
                const isReviewed = !!reviewed[r.file] && !running;
                const opacity = isReviewed ? '0.5' : '1';
                const badge = running
                    ? '<span style="color:#e67e22;font-size:0.75rem;font-weight:700;margin-left:0.4rem">RUNNING</span>'
                    : isStaleRun(r) && !isReviewed
                    ? '<span style="color:var(--red);font-size:0.75rem;font-weight:700;margin-left:0.4rem">STALLED</span>'
                    : isReviewed
                    ? '<span style="color:#4caf50;font-size:0.75rem;margin-left:0.4rem">Reviewed</span>'
                    : '<span style="color:var(--gold);font-size:0.75rem;font-weight:700;margin-left:0.4rem">NEW</span>';
                const toggleTitle = running ? 'Run in progress' : (isReviewed ? 'Mark as unreviewed' : 'Mark as reviewed');
                html += `<div style="display:flex;align-items:stretch;margin-bottom:0.5rem;opacity:${opacity}">
                    <div onclick="window.open(${jsArg(fileUrl)},'_blank')" style="flex:1;cursor:pointer;background:var(--bg-card);border:1px solid var(--border);border-radius:8px 0 0 8px;padding:0.8rem">
                        <div style="font-family:'Playfair Display',serif;font-size:0.95rem;color:var(--gold)">${esc(r.title)}${badge}</div>
                        <div style="font-size:0.75rem;color:var(--text-dim);margin-top:0.3rem">${esc(r.summary || '')}</div>
                    </div>
                    <button onclick="toggleReportReviewed(${jsArg(r.file)})" style="background:${isReviewed ? '#1a2e1a' : 'var(--bg-card)'};border:1px solid var(--border);border-left:none;border-radius:0 8px 8px 0;padding:0 0.8rem;cursor:pointer;font-size:1.1rem;color:${isReviewed ? '#4caf50' : '#555'}" title="${toggleTitle}">${running ? '&#8987;' : isReviewed ? '&#10003;' : '&#9675;'}</button>
                </div>`;
            }
        }
    }

    body.innerHTML = html;
    if (dashboardData) renderStateGrid();
}

// Markers the pipeline / manual check leave on venues it parked (see P4 status flow)
const REVIEW_FLAG_RE = /pipeline|0 contacts|zero contacts|closed|dead|not a venue|not-a-venue|junk|motel|airbnb|vrbo|too far|out of area|quarantin|duplicate|wrong business|flag/i;
function hasReviewFlag(v) { return REVIEW_FLAG_RE.test((v.check_status || '') + ' ' + (v.notes || '')); }

function toggleReportReviewed(file) {
    const report = (reportManifest || []).find(r => r && r.file === file);
    if (isActiveRun(report)) { showToast('Run still in progress — review it when the report is done'); return; }
    const reviewed = getReviewedReports();
    const marking = !reviewed[file];
    setReportReviewed(file, marking);
    _gatedVenueIds = null; // invalidate gate cache
    // Reviewing never changes the status of venues the pipeline processed: pipelined stays
    // pipelined and zero-contact or flagged (closed/motel/...) needs_review stays needs_review.
    // A report can opt discovery-verified venues in via promote_ids; those move to untouched
    // only if still needs_review, with a real website and no park flag.
    if (marking && BASE_URL && report && report.promote_ids && dashboardData) {
        const idx = getIndex();
        for (const vid of reportVenueIds(report, 'promote_ids')) {
            const v = idx.venueById.get(vid);
            if (!v || v.status !== 'needs_review' || !safeHttpUrl(v.website) || hasReviewFlag(v)) continue;
            fireGet(buildUrl({ action: 'update_venue', venue_id: vid, field: 'status', value: 'untouched' }), function(res) {
                if (res.status === 'ok' && res.verified !== false) { v.status = 'untouched'; invalidateIndex(); }
                else showToast('Status not updated for ' + v.name);
            });
        }
    }
    openReportsView();
    // Re-render home view so venue counts update
    if (dashboardData) renderStateGrid();
}

function titleCase(s) { return s.replace(/\b\w/g, c => c.toUpperCase()); }

function getMonthlyDefaults() {

function getMonthKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function getMonthlyTasks() {
    const data = lsJSON(MONTHLY_KEY, {});
    const currentMonth = getMonthKey();
    if (data.month !== currentMonth) {
        // New month — use saved defaults
        const defaults = getMonthlyDefaults();
        const tasks = defaults.map((d, i) => {

            return task;
        });
        const fresh = { month: currentMonth, tasks: tasks };
        safeLocalSave(MONTHLY_KEY, JSON.stringify(fresh));
        return fresh;
    }
    return data;
}

function safeLocalSave(key, payload) {
    try { localStorage.setItem(key, payload); return true; }
    catch(e) { console.error('[Email] localStorage QUOTA ERROR:', e); return false; }
}

function saveMonthlyTasks(data) {
    var ok = safeLocalSave(MONTHLY_KEY, JSON.stringify(data));
    if (ok) syncMonthlyToCloud();
}

function saveMonthlyDefaults(arr) {
    var ok = safeLocalSave(MONTHLY_DEFAULTS_KEY, JSON.stringify(arr));
    if (ok) syncMonthlyToCloud();
}

// Monthly sync follows the cloud-sync pattern: pull, merge against the last synced copy
// (base), push only real data. The lock opens only after a successful pull or when this
// device already had real tasks before the skeleton was created.
const MONTHLY_BASE_KEY = 'outreach_monthly_base'; // {tasks, defaults} as last synced with the cloud
let _syncTimer = null;
let _monthlyReady = false;
let _monthlyFresh = false; // no real local tasks at startup (new device / cache wipe): cloud wins
let _monthlySyncBusy = false, _monthlySyncAgain = false;

function hasRealMonthly(obj) { return !!(obj && obj.month && Array.isArray(obj.tasks) && obj.tasks.length > 0); }
function parseJSONSafe(s) {
    if (s == null || s === '') return null;
    if (typeof s !== 'string') return s;
    try { return JSON.parse(s); } catch (e) { return null; }
}
function monthlyItemChanged(a, b) {
    return !b || a.text !== b.text || !!a.done !== !!b.done || !sameVal(a.subtasks || [], b.subtasks || []);
}
// Merge a task (or subtask) list by id: what this device added/edited/deleted since base
// wins, everything else follows the cloud. Cloud order first, local additions appended.
function mergeMonthlyList(local, cloud, base) {
    local = local || []; cloud = cloud || []; base = base || [];
    const L = new Map(local.map(t => [t.id, t])), C = new Map(cloud.map(t => [t.id, t])), B = new Map(base.map(t => [t.id, t]));
    const order = cloud.map(t => t.id).concat(local.map(t => t.id).filter(id => !C.has(id)));
    const out = [];
    for (const id of order) {
        const l = L.get(id), c = C.get(id), b = B.get(id);
        if (l && c) {
            const pickField = f => (b && sameVal(l[f], b[f])) ? c[f] : l[f];
            const m = Object.assign({}, c, { text: pickField('text'), done: !!pickField('done') });
            if (l.subtasks || c.subtasks) {
                m.subtasks = mergeMonthlyList(l.subtasks, c.subtasks, b && b.subtasks);
                if (m.subtasks.length) m.done = m.subtasks.every(s => s.done); // parent follows subtasks, as the toggles do
            }
            out.push(m);
        } else if (l) {
            if (!b || monthlyItemChanged(l, b)) out.push(l); // gone from the cloud unless new/edited here
        } else if (c) {
            if (!b || monthlyItemChanged(c, b)) out.push(c); // deleted here unless new/edited in the cloud
        }
    }
    return out;
}
function mergeMonthlyTasks(local, cloud, base) {
    if (!hasRealMonthly(cloud)) return local;
    if (!hasRealMonthly(local)) return cloud;
    if (local.month !== cloud.month) return local.month > cloud.month ? local : cloud;
    const baseTasks = (base && base.month === local.month) ? base.tasks : null;
    return { month: local.month, tasks: mergeMonthlyList(local.tasks, cloud.tasks, baseTasks) };
}

function syncMonthlyToCloud() {
    // Debounce — wait 2s after last change before syncing
    clearTimeout(_syncTimer);
    _syncTimer = setTimeout(() => monthlySync(true), 2000);
}

function loadMonthlyFromCloud(cb) { monthlySync(true, cb); }

function monthlySync(allowPush, cb) {
    const done = ok => { if (cb) cb(ok); };
    const url = buildUrl({ action: 'load_monthly' });
    if (!url) { done(false); return; }
    if (_monthlySyncBusy) { _monthlySyncAgain = true; done(false); return; }
    _monthlySyncBusy = true;
    const finish = ok => {
        _monthlySyncBusy = false;
        done(ok);
        if (_monthlySyncAgain) { _monthlySyncAgain = false; monthlySync(true); }
    };
    jsonpFetch(url, function(err, data) {
      // finish() must always run, or every later sync would be skipped as "busy"
      try {
        // Failed pull: keep local as-is and never push blind
        if (err || !data || data.status !== 'ok') { finish(false); return; }
        const cloudTasks = parseJSONSafe(data.tasks);
        const cloudDefs = parseJSONSafe(data.defaults);
        const base = lsJSON(MONTHLY_BASE_KEY, null) || {};
        const beforeTasks = localStorage.getItem(MONTHLY_KEY);
        const beforeDefs = localStorage.getItem(MONTHLY_DEFAULTS_KEY);
        const localTasks = parseJSONSafe(beforeTasks);
        const localDefs = parseJSONSafe(beforeDefs);

        // Defaults: an edit made here since the last sync wins; otherwise the cloud's list
        const cloudDefsOk = Array.isArray(cloudDefs) && cloudDefs.length > 0;
        const localDefsOk = Array.isArray(localDefs) && localDefs.length > 0;
        const localDefsEdited = !_monthlyFresh && localDefsOk && base.defaults !== undefined && !sameVal(localDefs, base.defaults);
        const defs = localDefsEdited ? localDefs : (cloudDefsOk ? cloudDefs : (localDefsOk ? localDefs : null));
        if (defs) safeLocalSave(MONTHLY_DEFAULTS_KEY, JSON.stringify(defs));

        // Tasks: cloud wins on a fresh device; otherwise per-task 3-way merge
        let tasks = (_monthlyFresh || !hasRealMonthly(localTasks))
            ? (hasRealMonthly(cloudTasks) ? cloudTasks : localTasks)
            : mergeMonthlyTasks(localTasks, cloudTasks, base.tasks);
        if (tasks) safeLocalSave(MONTHLY_KEY, JSON.stringify(tasks));
        tasks = getMonthlyTasks(); // rolls into a new month from the merged defaults if needed

        _monthlyFresh = false;
        _monthlyReady = true;
        if (localStorage.getItem(MONTHLY_KEY) !== beforeTasks || localStorage.getItem(MONTHLY_DEFAULTS_KEY) !== beforeDefs) {
            renderMonthlyTasks();
        }

        const params = { action: 'save_monthly' };
        if (hasRealMonthly(tasks) && !sameVal(tasks, cloudTasks)) params.tasks = JSON.stringify(tasks);
        // Never send an empty defaults list: it would wipe the custom defaults in the Sheet
        if (defs && defs.length > 0 && !sameVal(defs, cloudDefs)) params.defaults = JSON.stringify(defs);
        if (!allowPush || (!params.tasks && !params.defaults)) {
            writeJSON(MONTHLY_BASE_KEY, { tasks: cloudTasks, defaults: cloudDefs });
            finish(true);
            return;
        }
        // Send both so the Sheet always holds a consistent pair
        if (hasRealMonthly(tasks)) params.tasks = JSON.stringify(tasks);
        if (defs && defs.length > 0) params.defaults = JSON.stringify(defs);
        jsonpFetch(buildUrl(params), function(err2, res) {
            if (!err2 && res && res.status === 'ok') {
                writeJSON(MONTHLY_BASE_KEY, { tasks: params.tasks ? tasks : cloudTasks, defaults: params.defaults ? defs : cloudDefs });
            } else {
                console.warn('[Monthly] cloud save failed:', err2 || (res && res.message));
                showToast('Monthly tasks not synced — will retry');
            }
            finish(true);
        });
      } catch (e) { console.error('[Monthly] sync error:', e); finish(false); }
    });
}

// === MARK VENUE DONE / RESET ===
function venueHasVerifiedContact(venueId) {
    return (getIndex().contactsByVenue.get(venueId) || []).some(c => c.email && isSendableStatus(c.verified));
}

// Un-mark Done: back to pipelined when the venue has verified contacts, else untouched.
// (It never triggered a re-scrape: build_batch skips reported venues and venues with contacts.)
function resetVenue(venueId) {
    if (!BASE_URL) { showToast('API not configured'); return; }
    const newStatus = venueHasVerifiedContact(venueId) ? 'pipelined' : 'untouched';
    // force: the new backend refuses contacted -> pipelined/untouched without it; this is an explicit user undo
    fireGet(buildUrl({ action: 'update_venue', venue_id: venueId, field: 'status', value: newStatus, force: 'true' }), function(data) {
        if (data.status !== 'ok' || data.verified === false) { showToast('Not saved: ' + resMsg(data)); return; }
        const v = getIndex().venueById.get(venueId);
        if (v) {
            v.status = newStatus;
            if (newStatus === 'untouched') v.contacted_date = '';
        }
        invalidateIndex();
        showToast('Venue un-marked (' + newStatus + ')');
        // Re-render from the updated local data (loadDashboard skips while the detail view is open)
        if (navStack[navStack.length - 1] === 'viewDetail' && window._currentVenueId === venueId) openVenueDetail(venueId);
        renderStateGrid();
    });
}

function saveDetailNote(venueId) {
    const note = (document.getElementById('detailNote') || {}).value || '';
    if (!note.trim()) { showToast('Nothing to save'); return; }
    // Notes feed the taste review: only say "saved" once the Sheet confirms it
    fireGet(buildUrl({ action: 'update_venue', venue_id: venueId, field: 'venue_feedback', value: note.trim() }), function(res) {
        if (res.status !== 'ok' || res.verified === false) { showToast('Note NOT saved: ' + resMsg(res)); return; }
        showToast('Note saved');
        const dv = getIndex().venueById.get(venueId);
        if (dv) dv.venue_feedback = note.trim();
    });
}

// "contacted" means outreach went out (it starts the 2.5-year resurface clock). Marking a
// venue done with nothing sent records it as "dismissed" instead, so metrics stay honest.
function markVenueDone(venueId) {
    if (!BASE_URL) { showToast('API not configured'); return; }
    const idx = getIndex();
    const v = idx.venueById.get(venueId);
    // 'sent_elsewhere' = this person was already emailed from another venue row
    const anySent = (idx.contactsByVenue.get(venueId) || []).some(c => isSentFlag(c.email_sent) || c.email_sent === 'sent_elsewhere')
        || !!(v && (v.ig_dm_sent || v.fb_msg_sent || v.contact_form_sent));
    const msg = anySent
        ? 'Mark this venue as contacted? It will be hidden from action lists.'
        : 'No outreach has been logged for this venue.\n\nDismiss it? It will be hidden from action lists (saved as "dismissed", not "contacted").';
    if (!confirm(msg)) return;
    const save = function(newStatus) {
        fireGet(buildUrl({ action: 'update_venue', venue_id: venueId, field: 'status', value: newStatus }), function(data) {
            // A backend that doesn't know "dismissed" yet: keep the old behaviour rather than fail
            if (newStatus === 'dismissed' && data.status === 'error' && /invalid status/i.test(data.message || '')) {
                save('contacted');
                return;
            }
            if (data.status !== 'ok' || data.verified === false) { showToast('Not saved: ' + resMsg(data)); return; }
            if (v) {
                v.status = newStatus;
                if (newStatus === 'contacted') v.contacted_date = new Date().toISOString();
            }
            invalidateIndex();
            showToast(newStatus === 'dismissed' ? 'Venue dismissed' : 'Venue hidden!');
            goBack();
            setTimeout(loadDashboard, 500);
        });
    };
    save(anySent ? 'contacted' : 'dismissed');
}

function toggleMonthlyTask(id) {
    const data = getMonthlyTasks();
    const task = data.tasks.find(t => t.id === id);
    if (!task) return;
    task.done = !task.done;
    // If parent has subtasks, toggle all subtasks too
    if (task.subtasks && task.subtasks.length > 0) {
        task.subtasks.forEach(s => s.done = task.done);
    }
    saveMonthlyTasks(data);
    renderMonthlyTasks();
}

function toggleMonthlySubtask(parentId, subId) {
    const data = getMonthlyTasks();
    const task = data.tasks.find(t => t.id === parentId);
    if (!task || !task.subtasks) return;
    const sub = task.subtasks.find(s => s.id === subId);
    if (sub) sub.done = !sub.done;
    // Auto-complete parent if all subtasks done
    const allDone = task.subtasks.every(s => s.done);
    const anyDone = task.subtasks.some(s => s.done);
    if (allDone) task.done = true;
    else if (!anyDone) task.done = false;
    else task.done = false;
    saveMonthlyTasks(data);
    renderMonthlyTasks();
}

function addMonthlySubtask(parentId) {
    const text = prompt('New subtask:');
    if (!text || !text.trim()) return;
    const data = getMonthlyTasks();
    const task = data.tasks.find(t => t.id === parentId);
    if (!task) return;
    if (!task.subtasks) task.subtasks = [];
    const maxSubId = task.subtasks.reduce((m, s) => Math.max(m, s.id), 0);
    task.subtasks.push({ id: maxSubId + 1, text: titleCase(text.trim()), done: false });
    saveMonthlyTasks(data);
    renderMonthlyTasks();
}

function editMonthlySubtask(parentId, subId) {
    const data = getMonthlyTasks();
    const task = data.tasks.find(t => t.id === parentId);
    if (!task || !task.subtasks) return;
    const sub = task.subtasks.find(s => s.id === subId);
    if (!sub) return;
    const choice = prompt('Edit subtask (clear to delete):', sub.text);
    if (choice === null) return;
    if (choice.trim() === '') {
        task.subtasks = task.subtasks.filter(s => s.id !== subId);
    } else {
        sub.text = titleCase(choice.trim());
    }
    saveMonthlyTasks(data);
    renderMonthlyTasks();
}

function addMonthlyTask() {
    const text = prompt('New task:');
    if (!text || !text.trim()) return;
    const data = getMonthlyTasks();
    const maxId = data.tasks.reduce((m, t) => Math.max(m, t.id), 0);
    data.tasks.push({ id: maxId + 1, text: titleCase(text.trim()), done: false });
    saveMonthlyTasks(data);
    renderMonthlyTasks();
}

function editMonthlyTask(id) {
    const data = getMonthlyTasks();
    const task = data.tasks.find(t => t.id === id);
    if (!task) return;
    const choice = prompt('Edit task (clear to delete):', task.text);
    if (choice === null) return; // cancelled
    if (choice.trim() === '') {
        // Delete
        data.tasks = data.tasks.filter(t => t.id !== id);
    } else {
        task.text = titleCase(choice.trim());
    }
    saveMonthlyTasks(data);
    renderMonthlyTasks();
}

function removeMonthlyTask(id) {
    const data = getMonthlyTasks();
    data.tasks = data.tasks.filter(t => t.id !== id);
    saveMonthlyTasks(data);
    renderMonthlyTasks();
}

function countMonthlyItems(tasks) {
    let total = 0, done = 0;
    for (const t of tasks) {
        if (t.subtasks && t.subtasks.length > 0) {
            total += t.subtasks.length;
            done += t.subtasks.filter(s => s.done).length;
        } else {
            total++;
            if (t.done) done++;
        }
    }
    return { total, done };
}

function renderMonthlyTasks() {
    // Monthly tasks enabled
    const data = getMonthlyTasks();
    const tasks = data.tasks || [];
    const { total, done: doneCount } = countMonthlyItems(tasks);
    const remaining = total - doneCount;
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const monthLabel = monthNames[new Date().getMonth()] + ' ' + new Date().getFullYear();

    // Flashing pill (shows on mobile, also visible on desktop)
    const pill = document.getElementById('monthlyPill');
    if (remaining > 0) {
        pill.textContent = remaining + ' task' + (remaining !== 1 ? 's' : '');
        pill.style.display = '';
        pill.classList.remove('all-done');
    } else if (tasks.length > 0) {
        pill.textContent = 'All done!';
        pill.style.display = '';
        pill.classList.add('all-done');
    } else {
        pill.style.display = 'none';
    }

    // Full task list (collapsible, starts collapsed)
    const section = document.getElementById('monthlySection');
    const wasOpen = section.querySelector('.monthly-body.open') !== null;
    let html = `<div class="monthly-header${wasOpen ? ' open' : ''}" onclick="toggleMonthlyBody()">`;
    html += `<span class="monthly-title">${monthLabel} Tasks</span>`;
    html += `<span class="monthly-progress">${doneCount}/${tasks.length}</span>`;
    html += `</div>`;
    html += `<div class="monthly-body${wasOpen ? ' open' : ''}">`;
    for (const t of tasks) {
        html += `<div class="monthly-task${t.done ? ' done' : ''}" onclick="toggleMonthlyTask(${Number(t.id)})">`;
        html += `<span class="monthly-check">${t.done ? '&#10003;' : ''}</span>`;
        html += `<span class="monthly-task-text">${esc(t.text)}</span>`;
        html += `<span class="monthly-add-sub" onclick="event.stopPropagation();addMonthlySubtask(${Number(t.id)})" title="Add subtask">+</span>`;
        html += `<span class="monthly-edit" onclick="event.stopPropagation();editMonthlyTask(${Number(t.id)})">&#9998;</span>`;
        html += `</div>`;
        if (t.subtasks && t.subtasks.length > 0) {
            for (const s of t.subtasks) {
                html += `<div class="monthly-subtask${s.done ? ' done' : ''}" onclick="toggleMonthlySubtask(${Number(t.id)},${Number(s.id)})">`;
                html += `<span class="monthly-check">${s.done ? '&#10003;' : ''}</span>`;
                html += `<span class="monthly-task-text">${esc(s.text)}</span>`;
                html += `<span class="monthly-edit" onclick="event.stopPropagation();editMonthlySubtask(${Number(t.id)},${Number(s.id)})">&#9998;</span>`;
                html += `</div>`;
            }
        }
    }
    html += `<div class="monthly-add" onclick="event.stopPropagation();addMonthlyTask()">+ Add task</div>`;
    html += `<div class="monthly-add monthly-edit-defaults" onclick="event.stopPropagation();openDefaultsEditor()">&#9881; Edit Monthly Defaults</div>`;
    html += `</div>`;
    section.innerHTML = html;
}

function toggleMonthlyBody() {
    const body = document.querySelector('.monthly-body');
    const header = document.querySelector('.monthly-header');
    if (body) { body.classList.toggle('open'); header.classList.toggle('open'); }
}

function openDefaultsEditor() {
    const defaults = getMonthlyDefaults();
    const section = document.getElementById('monthlySection');
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const monthLabel = monthNames[new Date().getMonth()] + ' ' + new Date().getFullYear();
    let html = `<div class="monthly-header open" onclick="toggleMonthlyBody()">`;
    html += `<span class="monthly-title">${monthLabel} Tasks</span>`;
    html += `<span class="monthly-progress">Editing Defaults</span>`;
    html += `</div>`;
    html += `<div class="monthly-body open">`;
    html += `<div style="padding:0.3rem 0.5rem;font-size:0.75rem;color:var(--text-dim);margin-bottom:0.3rem">These tasks reset every month. Tap &#9998; to edit, &#10005; to remove.</div>`;
    for (let i = 0; i < defaults.length; i++) {
        const d = defaults[i];
        html += `<div class="monthly-task">`;
        html += `<span class="monthly-task-text" style="flex:1">${esc(d.text)}</span>`;
        html += `<span class="monthly-add-sub" onclick="event.stopPropagation();addDefaultSubtask(${i})">+</span>`;
        html += `<span class="monthly-edit" onclick="event.stopPropagation();editDefault(${i})">&#9998;</span>`;
        html += `<span class="monthly-edit" onclick="event.stopPropagation();removeDefault(${i})" style="color:var(--red)">&#10005;</span>`;
        html += `</div>`;
        if (d.subtasks && d.subtasks.length > 0) {
            for (let j = 0; j < d.subtasks.length; j++) {
                html += `<div class="monthly-subtask">`;
                html += `<span class="monthly-task-text" style="flex:1">${esc(d.subtasks[j])}</span>`;
                html += `<span class="monthly-edit" onclick="event.stopPropagation();editDefaultSubtask(${i},${j})">&#9998;</span>`;
                html += `<span class="monthly-edit" onclick="event.stopPropagation();removeDefaultSubtask(${i},${j})" style="color:var(--red)">&#10005;</span>`;
                html += `</div>`;
            }
        }
    }
    html += `<div class="monthly-add" onclick="event.stopPropagation();addDefault()">+ Add Default Task</div>`;
    html += `<div class="monthly-add" onclick="event.stopPropagation();syncDefaultsToCurrent();renderMonthlyTasks()" style="color:var(--gold)">&#10003; Done</div>`;
    html += `</div>`;
    section.innerHTML = html;
}

function editDefault(idx) {
    const defaults = getMonthlyDefaults();
    const choice = prompt('Edit default task:', defaults[idx].text);
    if (choice === null) return;
    if (choice.trim() === '') { defaults.splice(idx, 1); }
    else { defaults[idx].text = titleCase(choice.trim()); }
    saveMonthlyDefaults(defaults);
    openDefaultsEditor();
}

function removeDefault(idx) {
    const defaults = getMonthlyDefaults();
    defaults.splice(idx, 1);
    saveMonthlyDefaults(defaults);
    openDefaultsEditor();
}

function addDefault() {
    const text = prompt('New default task:');
    if (!text || !text.trim()) return;
    const defaults = getMonthlyDefaults();
    defaults.push({ text: titleCase(text.trim()) });
    saveMonthlyDefaults(defaults);
    openDefaultsEditor();
}

function addDefaultSubtask(idx) {
    const text = prompt('New default subtask:');
    if (!text || !text.trim()) return;
    const defaults = getMonthlyDefaults();
    if (!defaults[idx].subtasks) defaults[idx].subtasks = [];
    defaults[idx].subtasks.push(titleCase(text.trim()));
    saveMonthlyDefaults(defaults);
    openDefaultsEditor();
}

function editDefaultSubtask(idx, subIdx) {
    const defaults = getMonthlyDefaults();
    const choice = prompt('Edit default subtask (clear to delete):', defaults[idx].subtasks[subIdx]);
    if (choice === null) return;
    if (choice.trim() === '') { defaults[idx].subtasks.splice(subIdx, 1); }
    else { defaults[idx].subtasks[subIdx] = titleCase(choice.trim()); }
    saveMonthlyDefaults(defaults);
    openDefaultsEditor();
}

function removeDefaultSubtask(idx, subIdx) {
    const defaults = getMonthlyDefaults();
    defaults[idx].subtasks.splice(subIdx, 1);
    saveMonthlyDefaults(defaults);
    openDefaultsEditor();
}

function syncDefaultsToCurrent() {
    const defaults = getMonthlyDefaults();
    const data = getMonthlyTasks();
    const tasks = data.tasks || [];
    // Rebuild task list from defaults, preserving done state
    const newTasks = defaults.map((d, i) => {
        // Try to find matching existing task by text (case-insensitive)
        const existing = tasks.find(t => t.text.toLowerCase() === d.text.toLowerCase());
        const task = { id: i, text: d.text, done: existing ? existing.done : false };
        if (d.subtasks && d.subtasks.length > 0) {
            const oldSubs = (existing && existing.subtasks) || [];
            task.subtasks = d.subtasks.map((s, j) => {
                const oldSub = oldSubs.find(os => os.text.toLowerCase() === s.toLowerCase());
                return { id: j + 1, text: s, done: oldSub ? oldSub.done : false };
            });
            // Auto-complete parent if all subtasks done
            if (task.subtasks.length > 0 && task.subtasks.every(s => s.done)) task.done = true;
        }
        return task;
    });
    data.tasks = newTasks;
    saveMonthlyTasks(data);
}

function scrollToTasks() {
    const data = getMonthlyTasks();
    const { total, done } = countMonthlyItems(data.tasks || []);
    const remaining = total - done;
    if (remaining > 0) {
        showToast(remaining + ' task' + (remaining !== 1 ? 's' : '') + ' remaining');
    } else {
        showToast('All tasks done this month!');
    }
}

// === PAST GIGS ===
let gigsData = []; // Cached from dashboard

// Gig dates come back either as 'YYYY-MM-DD' or as a Date string from the Sheet
// ("Mon Jan 01 2024 00:00:00 GMT-0500 ..."); appending T00:00:00 to the latter gave Invalid Date.
function parseGigDate(s) {
    s = String(s || '').trim();
    if (!s) return null;
    const d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T00:00:00') : new Date(s);
    return isNaN(d.getTime()) ? null : d;
}
function gigDateInputValue(s) {
    const d = parseGigDate(s);
    if (!d) return '';
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function openGigsView() {
    const body = document.getElementById('gigsBody');
    // Legacy soft-deleted rows stay in the sheet as '(DELETED)'
    gigsData = ((dashboardData && dashboardData.gigs) || []).filter(g => g.venue_name !== '(DELETED)');

    if (gigsData.length === 0) {
        body.innerHTML = '<div class="gig-empty">No past gigs yet.<br>Tap "+ Add" to log your first gig!</div>';
    } else {
        // Sort by overall score descending (best gigs first)
        const sorted = [...gigsData].sort((a, b) => (b.overall_score || 0) - (a.overall_score || 0));
        body.innerHTML = sorted.map(g => renderGigCard(g)).join('');
    }
    navigateTo('viewGigs');
}

function renderGigCard(g) {
    const scoreColor = g.overall_score >= 8 ? 'var(--green)' : g.overall_score >= 5 ? 'var(--gold)' : 'var(--red)';
    const cat = (g.category || 'other').toLowerCase().replace(/[\s\/]/g, '_');
    const gd = parseGigDate(g.date);
    const dateStr = gd ? gd.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
    let html = `<div class="gig-card" onclick="showEditGigForm(${jsArg(g.gig_id)})">`;
    html += `<div class="gig-card-top">`;
    html += `<div><div class="gig-card-name">${esc(g.venue_name)}</div>`;
    html += `<div class="gig-card-date">${dateStr}${g.category ? ' · ' : ''}<span class="category-badge ${esc(cat)}">${esc((g.category || '').toUpperCase())}</span></div></div>`;
    html += `<div class="gig-card-score" style="color:${scoreColor}">${(Number(g.overall_score) || 0).toFixed(1)}</div>`;
    html += `</div>`;
    html += `<div class="gig-card-ratings">`;
    html += `<span class="gig-rating-pill">Tips ${g.rating_tips}</span>`;
    html += `<span class="gig-rating-pill">Rebooked ${g.rating_rebooked}</span>`;
    html += `<span class="gig-rating-pill">Audience ${g.rating_audience}</span>`;
    html += `<span class="gig-rating-pill">Quality ${g.rating_venue_quality}</span>`;
    html += `</div>`;
    if (g.notes) html += `<div class="gig-card-notes">${esc(g.notes)}</div>`;
    html += `</div>`;
    return html;
}

function showAddGigForm() {
    renderGigForm(null);
    navigateTo('viewGigForm');
}

function showEditGigForm(gigId) {
    const gig = gigsData.find(g => g.gig_id === gigId);
    if (!gig) return;
    renderGigForm(gig);
    navigateTo('viewGigForm');
}

function renderGigForm(gig) {
    const isEdit = !!gig;
    document.getElementById('gigFormTitle').textContent = isEdit ? 'Edit Gig' : 'Add Past Gig';
    const body = document.getElementById('gigFormBody');

    // Build venue dropdown from dashboard venues
    const venues = (dashboardData && dashboardData.venues) || [];
    let venueOpts = '<option value="">— Not in system —</option>';
    venues.forEach(v => {
        const sel = (gig && gig.venue_id === v.venue_id) ? ' selected' : '';
        venueOpts += `<option value="${esc(v.venue_id)}" data-cat="${esc(v.category || '')}" data-name="${esc(v.name)}"${sel}>${esc(v.name)} (${esc(v.state || '')})</option>`;
    });

    // Build category dropdown
    const cats = ['winery', 'museum', 'hotel', 'country_club', 'event', 'restaurant', 'wine_bar', 'resort', 'senior_living', 'event_planner', 'golf_club', 'yacht_club', 'art_gallery', 'luxury_apts', 'grocery_market', 'farmers_market', 'wedding_venue', 'corporate', 'spa', 'private_club', 'church', 'luxury_retail', 'mall'];
    let catOpts = cats.map(c => `<option value="${c}"${gig && gig.category === c ? ' selected' : ''}>${CATEGORY_LABELS[c] || c}</option>`).join('');

    let html = '';
    // Venue select
    html += `<div class="gig-form-field"><label>Venue</label>`;
    html += `<select id="gigVenueSelect" onchange="onGigVenueChange()">`;
    html += venueOpts;
    html += `</select></div>`;

    // Venue name (for venues not in system)
    html += `<div class="gig-form-field" id="gigNameRow"${gig && gig.venue_id ? ' style="display:none"' : ''}>`;
    html += `<label>Venue Name</label>`;
    html += `<input type="text" id="gigVenueName" value="${esc(gig ? gig.venue_name : '')}" placeholder="e.g. The Inn at Perry Cabin"></div>`;

    // Date
    html += `<div class="gig-form-field"><label>Date</label>`;
    html += `<input type="date" id="gigDate" value="${esc(gig ? gigDateInputValue(gig.date) : gigDateInputValue(new Date().toString()))}"></div>`;

    // Category
    html += `<div class="gig-form-field"><label>Category</label>`;
    html += `<select id="gigCategory">${catOpts}</select></div>`;

    // Rating dots
    const ratingFields = [
        { key: 'tips', label: 'Tips / Pay', val: gig ? gig.rating_tips : 5 },
        { key: 'rebooked', label: 'Rebooked', val: gig ? gig.rating_rebooked : 5 },
        { key: 'audience', label: 'Audience', val: gig ? gig.rating_audience : 5 },
        { key: 'quality', label: 'Quality', val: gig ? gig.rating_venue_quality : 5 }
    ];

    for (const rf of ratingFields) {
        html += `<div class="rating-row">`;
        html += `<span class="rating-label">${rf.label}</span>`;
        html += `<div class="rating-dots" id="dots_${rf.key}">`;
        for (let i = 1; i <= 10; i++) {
            html += `<div class="rating-dot${i <= rf.val ? ' active' : ''}" data-rating="${rf.key}" data-val="${i}" onclick="setRating('${rf.key}',${i})">${i}</div>`;
        }
        html += `</div></div>`;
    }

    // Overall score display
    const overall = gig ? (Number(gig.overall_score) || 0) : 5;
    const overallColor = overall >= 8 ? 'var(--green)' : overall >= 5 ? 'var(--gold)' : 'var(--red)';
    html += `<div class="rating-overall" id="gigOverall" style="color:${overallColor}">${overall.toFixed(1)}</div>`;

    // Notes
    html += `<div class="gig-form-field"><label>Notes</label>`;
    html += `<textarea id="gigNotes" placeholder="What made it good/bad?">${esc(gig ? gig.notes : '')}</textarea></div>`;

    // Save button
    html += `<button class="gig-save-btn" onclick="saveGig(${jsArg(isEdit ? gig.gig_id : '')})">${isEdit ? 'Update Gig' : 'Save Gig'}</button>`;

    // Delete button (edit only)
    if (isEdit) {
        html += `<div style="text-align:center;margin-top:0.75rem">`;
        html += `<button class="gig-delete-btn" onclick="deleteGig(${jsArg(gig.gig_id)})">Delete Gig</button>`;
        html += `</div>`;
    }

    body.innerHTML = html;
}

function onGigVenueChange() {
    const sel = document.getElementById('gigVenueSelect');
    const nameRow = document.getElementById('gigNameRow');
    const opt = sel.options[sel.selectedIndex];
    if (sel.value) {
        nameRow.style.display = 'none';
        document.getElementById('gigVenueName').value = opt.getAttribute('data-name') || '';
        // Auto-set category from venue
        const vCat = (opt.getAttribute('data-cat') || '').toLowerCase().replace(/[\s\/]/g, '_');
        if (vCat) document.getElementById('gigCategory').value = vCat;
    } else {
        nameRow.style.display = '';
    }
}

function setRating(key, val) {
    const dots = document.querySelectorAll(`#dots_${key} .rating-dot`);
    dots.forEach(d => {
        const dv = parseInt(d.getAttribute('data-val'));
        if (dv <= val) d.classList.add('active');
        else d.classList.remove('active');
    });
    updateOverall();
}

function getRating(key) {
    const dots = document.querySelectorAll(`#dots_${key} .rating-dot.active`);
    return dots.length || 5;
}

function updateOverall() {
    const tips = getRating('tips');
    const rebooked = getRating('rebooked');
    const audience = getRating('audience');
    const quality = getRating('quality');
    const avg = (tips + rebooked + audience + quality) / 4;
    const el = document.getElementById('gigOverall');
    if (el) {
        el.textContent = avg.toFixed(1);
        el.style.color = avg >= 8 ? 'var(--green)' : avg >= 5 ? 'var(--gold)' : 'var(--red)';
    }
}

function saveGig(gigId) {
    const venueId = document.getElementById('gigVenueSelect').value || '';
    const venueName = venueId ? document.getElementById('gigVenueSelect').options[document.getElementById('gigVenueSelect').selectedIndex].getAttribute('data-name') : document.getElementById('gigVenueName').value.trim();
    const date = document.getElementById('gigDate').value;
    const category = document.getElementById('gigCategory').value;
    const notes = document.getElementById('gigNotes').value.trim();
    const tips = getRating('tips');
    const rebooked = getRating('rebooked');
    const audience = getRating('audience');
    const quality = getRating('quality');

    if (!venueName) { showToast('Enter a venue name'); return; }

    const params = {
        action: gigId ? 'update_gig' : 'add_gig',
        venue_name: venueName,
        venue_id: venueId,
        date: date,
        category: category,
        rating_tips: tips,
        rating_rebooked: rebooked,
        rating_audience: audience,
        rating_venue_quality: quality,
        notes: notes
    };
    if (gigId) params.gig_id = gigId;

    showToast('Saving...');
    fireGet(buildUrl(params), function(resp) {
        if (resp.status === 'ok') {
            showToast(gigId ? 'Gig updated!' : 'Gig saved!');
            goBack();
            setTimeout(loadDashboard, 500);
        } else {
            showToast('Error: ' + (resp.message || 'Unknown'));
        }
    });
}

function deleteGig(gigId) {
    if (!confirm('Delete this gig?')) return;
    showToast('Deleting...');
    const done = () => { showToast('Deleted'); goBack(); setTimeout(loadDashboard, 500); };
    fireGet(buildUrl({ action: 'delete_gig', gig_id: gigId }), function(resp) {
        if (resp.status === 'ok' && resp.deleted) { done(); return; }
        if (resp.status === 'error' && !/unknown|action/i.test(resp.message || '')) { showToast('Delete failed: ' + resMsg(resp)); return; }
        // A backend without delete_gig answers with the health check: fall back to the old soft delete
        fireGet(buildUrl({ action: 'update_gig', gig_id: gigId, venue_name: '(DELETED)' }), function(r2) {
            if (r2.status === 'ok') done();
            else showToast('Delete failed: ' + resMsg(r2));
        });
    });
}

function updateGigsCount() {
    const gigs = (dashboardData && dashboardData.gigs) || [];
    // Filter out deleted gigs
    const active = gigs.filter(g => g.venue_name !== '(DELETED)');
    document.getElementById('gigsCount').textContent = active.length;
}

function emailsForLevel(level) {
    if (level <= 1) return 0;
    return Math.round((level * level - 1) * 30000 / 22800);
}

function getLevelFromEmails(count) {
    var level = 1;
    while (level < 151 && emailsForLevel(level + 1) <= count) level++;
    return level;
}

function getLevelInfo(emailCount) {
    var level = getLevelFromEmails(emailCount);
    var current = emailsForLevel(level);
    var next = emailsForLevel(level + 1);
    var progress = (next > current)
        ? (emailCount - current) / (next - current) : 1;
    return {
        level: level, emailCount: emailCount,
        current: current, next: next,
        progress: progress,
        name: POKEDEX[level - 1] || 'Mew',
        pokeId: level,
        isMax: level >= 151
    };
}

function getEmailsSentCount() {
    if (!dashboardData) return 0;
    var count = 0;
    var contacts = dashboardData.contacts || [];
    for (var i = 0; i < contacts.length; i++) {
        if (contacts[i].email_sent === 'true') count++;
    }
    var venues = dashboardData.venues || [];
    for (var j = 0; j < venues.length; j++) {
        if (venues[j].contact_form_sent) count++;
        if (venues[j].ig_dm_sent) count++;
        if (venues[j].fb_msg_sent) count++;
    }
    return count;
}

function renderLevelBar() {
    var section = document.getElementById('levelSection');
    if (!section) return;
    var count = getEmailsSentCount();
    var info = getLevelInfo(count);
    var pct = Math.min(100, Math.max(0, info.progress * 100));
    section.style.display = '';
    document.getElementById('levelSprite').src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/' + info.pokeId + '.png';
    document.getElementById('levelPokemon').textContent = info.name;
    document.getElementById('levelLabel').textContent =
        'Lv. ' + info.level;
    document.getElementById('levelCount').textContent =
        count + ' / ' + info.next + ' sent';
    var fill = document.getElementById('levelFill');
    fill.className = 'level-fill';
    fill.style.width = pct + '%';

    // Build expanded details
    var gap = info.next - info.current;
    var left = info.next - count;
    var details = document.getElementById('levelDetails');
    var h = '';
    h += '<div class="level-stat-row">';
    h += '<span class="level-stat-label">Total outreach sent</span>';
    h += '<span class="level-stat-val">' + count + '</span></div>';
    h += '<div class="level-stat-row">';
    h += '<span class="level-stat-label">To next level</span>';
    h += '<span class="level-stat-val">' + left + '</span></div>';
    h += '<div class="level-stat-row">';
    h += '<span class="level-stat-label">Level ' + info.level +
        ' cost</span>';
    h += '<span class="level-stat-val">' + gap +
        ' outreach</span></div>';
    details.innerHTML = h;

    // Level-up detection
    var stored = parseInt(
        localStorage.getItem('outreach_level') || '0'
    );
    if (info.level > stored && stored > 0) {
        var header = document.getElementById('levelHeader');
        header.classList.add('evolve');
        showToast(info.name + '! Lv. ' + info.level);
        setTimeout(function() {
            header.classList.remove('evolve');
        }, 1500);
    }
    safeLocalSave('outreach_level', String(info.level));
}

function toggleLevel() {
    var section = document.getElementById('levelSection');
    section.classList.toggle('expanded');
    localStorage.setItem('outreach_level_expanded',
        section.classList.contains('expanded') ? '1' : '0');
}

// === INIT ===
document.addEventListener('DOMContentLoaded', () => {
    // Report gate data: reviewed reports (cloud) + report manifest. Capped at
    // 8s so a slow backend can't hold the dashboard render hostage.
    const manifestReady = loadReportManifest();
    _gateReady = Promise.race([
        Promise.all([loadReviewedReportsFromCloud(), manifestReady]),
        new Promise(r => setTimeout(r, 8000))
    ]).catch(() => {}).then(() => { _gatedVenueIds = null; });

    // Start the slow dashboard fetch now, in parallel with the gate calls.
    // Deep links (?venue=ID) open from applyDashboard once data is in.
    loadDashboard();

    // Meanwhile show the last saved dashboard, gated by the local reviewed list
    Promise.all([readCachedDashboard(), Promise.race([manifestReady, new Promise(r => setTimeout(r, 3000))])])
    .then(([cached]) => {
        if (!cached || !cached.data || dashboardData) return; // network already won
        _gatedVenueIds = null;
        applyDashboard(cached.data, true);
        if (_dashInFlight) setSyncStatus('Updating… (saved ' + _ago(Date.now() - cached.savedAt) + ')');
    })
    .catch(e => console.warn('Cached dashboard render failed:', e));

    try {
        // Decide "fresh device" BEFORE renderMonthlyTasks writes a skeleton into localStorage,
        // otherwise a wiped cache looked like real data and could push the skeleton over the Sheet
        _monthlyFresh = !hasRealMonthly(lsJSON(MONTHLY_KEY, null));
        renderMonthlyTasks(); // Show local immediately
        loadMonthlyFromCloud(); // pull-merge; nothing is pushed without a successful pull
        // Restore level bar expanded state
        if (localStorage.getItem('outreach_level_expanded') === '1') {
            var ls = document.getElementById('levelSection');
            if (ls) ls.classList.add('expanded');
        }
    } catch (e) { console.error('Init error:', e); }
    syncSkipWords(); // pull the cloud skip list (pipeline.sh filters Apollo titles with it)
});

// Pause polling while hidden. On return: re-read the report manifest (a run may have
// registered since), refresh if the data is over a minute old, and pull the small
// synced lists (at most every 2 minutes).
let _lastAuxSync = Date.now();
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') { clearTimeout(refreshTimer); return; }
    loadReportManifest(true).then(() => {
        // Only refresh on tab-return if NOT viewing a venue detail
        if (navStack[navStack.length - 1] === 'viewDetail') { scheduleRefresh(REFRESH_INTERVAL); return; }
        if (_dashInFlight) return; // its callback schedules the next refresh
        const age = Date.now() - _dashFetchedAt;
        if (age > 60000) loadDashboard();
        else { if (dashboardData) renderStateGrid(); scheduleRefresh(REFRESH_INTERVAL - age); }
    });
    if (Date.now() - _lastAuxSync > 120000) {
        _lastAuxSync = Date.now();
        monthlySync(true);
        syncReviewedReports();
        syncSkipWords();
    }
});

if ('serviceWorker' in navigator) {
    // clients.claim() on the very first install also fires controllerchange; only a change
    // while a worker was already in control means an update is waiting
    let _swControlled = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('service-worker.js').then(reg => {
        reg.update();
        // Show banner instead of force-reloading (don't nuke mid-session work)
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!_swControlled) { _swControlled = true; return; }
            if (document.querySelector('.sw-update-banner')) return;
            const banner = document.createElement('div');
            banner.className = 'sw-update-banner';
            banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#e67e22;color:#fff;text-align:center;padding:10px 16px;font-size:14px;cursor:pointer;';
            banner.innerHTML = 'Update available — <strong>tap to refresh</strong>';
            banner.onclick = () => window.location.reload();
            document.body.appendChild(banner);
        });
    }).catch(err => console.log('SW:', err));
}
